                      seen.add(rk)
                      if not re.fullmatch(r'\d{2}-\d{7}',q['id']) or ids[(q['season'],q['week'],q['team'],canon(q['player']))]!=[q['id']]: raise ValueError('Identidad semanal no unica')
                      if not all(eq(q[x],v) for x,v in [('weekly',w),('before',base),('candidate',c)]): raise ValueError('Evidencia distinta de cohorte')
                      delta,segments,play,reason=evaluate(q,review[rk]); corrections[k]=delta
                      out.update(delta=delta,candidate_410=c+delta,segments=segments,play_id=play,reason=reason,status='Coincidencia candidata' if eq(w,c+delta) else 'Pendiente tras candidato')
                  except (ValueError,KeyError,TypeError) as exc: out['reason']=str(exc)
                  cases.append(out)
              final=set()
              for k,(w,base,c) in full.items():
                  z=years[k[0]]; bad=not eq(w,c+corrections.get(k,0)); was=k in old
                  if bad: final.add(k)
                  z['pending_48']+=int(was); z['pending_410']+=int(bad); z['resolved_fields']+=int(was and not bad); z['new_fields_vs_48']+=int(bad and not was); z['new_fields_vs_46']+=int(bad and k not in before); z['changed_fields']+=int(k in corrections)
              totals={k:sum(z[k] for z in years.values()) for k in ('compared_fields','pending_48','pending_410','resolved_fields','new_fields_vs_48','new_fields_vs_46','changed_fields')}
              totals.update(pending_player_games_48=len({k[:4] for k in old}),pending_player_games_410=len({k[:4] for k in final}),reviewed_not_present=len(set(review)-seen))
              return {'protocol':'4.10-audit-only','generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'ok':True,'scope':'Casos revisados, no regla general','totals':totals,'years':[{'season':y,**dict(z)} for y,z in sorted(years.items())],'cases':cases}
          try:
              result=run()
              print('Data Reconciliation 4.10: '+json.dumps(result['totals']))
          except Exception as exc:
              result={'protocol':'4.10-audit-only','generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'ok':False,'error':str(exc),'years':[],'cases':[]}
              print('::warning::Data Reconciliation 4.10: '+str(exc))
          (root/'pbp_reviewed_reconciliation.json').write_text(json.dumps(result,ensure_ascii=False,separators=(',',':'),allow_nan=False),encoding='utf-8')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: .

  publicar:
    needs: preparar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirmar disponibilidad del paquete
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for intento in {1..12}; do
            if cantidad=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length'); then
              if [ "$cantidad" = "1" ]; then
                echo 'Paquete listo para publicar'
                exit 0
              fi
              if [ "$cantidad" -gt 1 ]; then
                echo 'Se encontraron paquetes duplicados'
                exit 1
              fi
            fi
            echo "Paquete aun no disponible: intento $intento"
            sleep 10
          done
          echo 'No se pudo confirmar el paquete github-pages'
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
