name: BORU NFL - Estadisticas

on:
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-nfl.yml'
      - 'index.html'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar estadisticas NFL de nflverse
        run: |
          python3 - <<'PY'
          import csv, datetime, io, json, math, pathlib, urllib.request
          now = datetime.datetime.now(datetime.timezone.utc)
          latest = now.year if now.month >= 8 else now.year-1
          seasons = list(range(latest-4, latest+1))
          fields = ['passing_yards','attempts','completions','rushing_yards','carries','receiving_yards','receptions','targets']
          records = []
          for season in seasons:
              url = f'https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_{season}.csv'
              req = urllib.request.Request(url, headers={'User-Agent':'BORU-NFL/1.0'})
              with urllib.request.urlopen(req, timeout=120) as response:
                  rows = csv.DictReader(io.StringIO(response.read().decode('utf-8-sig')))
                  count = 0
                  for r in rows:
                      if r.get('season_type','REG') != 'REG' or r.get('position') not in ('QB','RB','FB','WR','TE'):
                          continue
                      name = (r.get('player_display_name') or r.get('player_name') or '').strip()
                      if not name or not r.get('week'):
                          continue
                      item = {'player':name, 'player_id':r.get('player_id',''),
                              'position':r.get('position',''), 'team':r.get('team') or r.get('recent_team',''),
                              'opponent':r.get('opponent_team',''), 'season':int(r.get('season') or season),
                              'week':int(r['week'])}
                      for field in fields:
                          raw = r.get(field)
                          if field == 'carries' and raw in (None,''):
                              raw = r.get('rushing_attempts')
                          try:
                              num = float(raw)
                              item[field] = num if math.isfinite(num) else None
                          except (ValueError,TypeError):
                              item[field] = None
                      if not any(item[field] is not None for field in fields):
                          continue
                      records.append(item)
                      count += 1
              if count < 30:
                  raise RuntimeError(f'Datos insuficientes para {season}: {count}')
          pathlib.Path('data').mkdir(exist_ok=True)
          pathlib.Path('data/player_stats.json').write_text(json.dumps({
              'source':'nflverse - estadisticas semanales',
              'updated_at':now.isoformat(), 'seed_mode':False,
              'records':records}, ensure_ascii=False), encoding='utf-8')
          print(f'{len(records)} registros preparados')
          PY
      - name: Descargar reporte de lesiones ESPN (contexto)
        run: |
          python3 - <<'PY'
          import datetime, json, pathlib, urllib.request
          now = datetime.datetime.now(datetime.timezone.utc)
          url = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/injuries'
          result = {'source':'ESPN (fuente secundaria)', 'fetched_at':now.isoformat(), 'ok':False, 'season':None, 'records':[]}
          try:
              req = urllib.request.Request(url, headers={'User-Agent':'BORU-NFL/1.0', 'Accept':'application/json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.load(response)
              groups = payload.get('injuries')
              if not isinstance(groups, list) or not groups:
                  raise ValueError('Sin grupos de lesiones')
              season = payload.get('season') or {}
              result['season'] = season.get('year') if isinstance(season, dict) else None
              records = []
              for group in groups:
                  team = group.get('team') or {}
                  if not isinstance(team, dict): team = {}
                  abbreviation = team.get('abbreviation') or group.get('abbreviation') or ''
                  team_name = team.get('displayName') or group.get('displayName') or ''
                  for injury in group.get('injuries') or []:
                      athlete = injury.get('athlete') or {}
                      name = athlete.get('fullName') or athlete.get('displayName') or ''
                      pos = athlete.get('position') or {}
                      typ = injury.get('type') or {}
                      details = injury.get('details') or {}
                      if not isinstance(details, dict): details = {}
                      status = injury.get('status') or ''
                      if not isinstance(status, str): status = ''
                      if not name or not status: continue
                      records.append({'name':name, 'id':str(athlete.get('id') or ''), 'team':abbreviation, 'team_name':team_name, 'position':pos.get('abbreviation','') if isinstance(pos,dict) else '', 'status':status, 'injury':details.get('type') or (typ.get('description','') if isinstance(typ,dict) else ''), 'date':injury.get('date') or ''})
              if not records:
                  raise ValueError('No se encontraron registros interpretables')
              result.update(ok=True, records=records)
              print(f'Lesiones: {len(records)} registros interpretables')
          except Exception as exc:
              result['error'] = 'Reporte no disponible o formato no reconocido'
              print(f'::warning::Fuente secundaria de lesiones no disponible: {type(exc).__name__}')
          pathlib.Path('data').mkdir(exist_ok=True)
          pathlib.Path('data/injuries.json').write_text(json.dumps(result, ensure_ascii=False), encoding='utf-8')
          PY
      - name: Descargar plantillas NFL y estados de reserva (nflverse)
        run: |
          python3 - <<'PY'
          import csv, datetime, io, json, pathlib, urllib.request
          now = datetime.datetime.now(datetime.timezone.utc)
          season = now.year if now.month >= 3 else now.year - 1
          url = f'https://github.com/nflverse/nflverse-data/releases/download/weekly_rosters/roster_weekly_{season}.csv'
          result = {'source':'nflverse - plantillas semanales','season':season,'fetched_at':now.isoformat(),'source_modified':None,'week':None,'ok':False,'records':[]}
          def clean(v):
              return '' if v is None or str(v).strip().lower() in ('','na','nan','null','none') else str(v).strip()
          try:
              req = urllib.request.Request(url, headers={'User-Agent':'BORU-NFL/1.0'})
              with urllib.request.urlopen(req, timeout=45) as response:
                  result['source_modified'] = response.headers.get('Last-Modified')
                  rows = list(csv.DictReader(io.StringIO(response.read().decode('utf-8-sig'))))
              valid = [r for r in rows if clean(r.get('week')).isdigit() and clean(r.get('game_type')).upper() in ('REG','R') and clean(r.get('gsis_id')) and clean(r.get('status'))]
              if not valid: raise ValueError('Sin plantillas REG interpretables')
              week = max(int(r['week']) for r in valid)
              records = []
              for r in valid:
                  if int(r['week']) != week: continue
                  name = clean(r.get('full_name')) or clean(r.get('football_name')) or clean(r.get('player_name'))
                  if not name: name = ' '.join(filter(None,[clean(r.get('first_name')),clean(r.get('last_name'))]))
                  if not name: continue
                  records.append({'name':name,'gsis_id':clean(r.get('gsis_id')),'espn_id':clean(r.get('espn_id')),'team':clean(r.get('team')),'position':clean(r.get('position')),'status':clean(r.get('status')),'status_description':clean(r.get('status_description')),'headshot':clean(r.get('headshot_url')) or clean(r.get('headshot'))})
              if len(records)<500 or len({r['team'] for r in records if r['team']})<32: raise ValueError('Cobertura de plantillas insuficiente')
              result.update(ok=True,week=week,records=records)
              print(f'Plantillas: semana {week}, {len(records)} jugadores, {len(set(r["team"] for r in records))} equipos')
          except Exception as exc:
              print(f'::warning::Plantillas no disponibles: {type(exc).__name__}: {exc}')
          pathlib.Path('data').mkdir(exist_ok=True)
          pathlib.Path('data/rosters.json').write_text(json.dumps(result,ensure_ascii=False),encoding='utf-8')
          PY
      - name: Descargar calendario NFL (nflverse)
        run: |
          python3 - <<'PY'
          import csv, datetime, io, json, pathlib, urllib.request
          from zoneinfo import ZoneInfo
          now = datetime.datetime.now(datetime.timezone.utc)
          season = now.year if now.month >= 3 else now.year - 1
          url = 'https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv'
          result = {'source':'nflverse - calendario','fetched_at':now.isoformat(),'season':season,'ok':False,'records':[]}
          try:
              req = urllib.request.Request(url, headers={'User-Agent':'BORU-NFL/1.0'})
              with urllib.request.urlopen(req, timeout=45) as response:
                  rows = csv.DictReader(io.StringIO(response.read().decode('utf-8-sig')))
                  records = []
                  for r in rows:
                      if r.get('season') != str(season) or r.get('game_type') != 'REG': continue
                      if not r.get('game_id') or not r.get('home_team') or not r.get('away_team'): continue
                      kickoff = None
                      try:
                          local = datetime.datetime.fromisoformat(r['gameday']+'T'+r['gametime'])
                          kickoff = local.replace(tzinfo=ZoneInfo('America/New_York')).astimezone(datetime.timezone.utc).isoformat()
                      except (ValueError, KeyError, TypeError): pass
                      records.append({'id':r['game_id'],'week':int(r['week']),'date':r.get('gameday'),'kickoff':kickoff,'home':r['home_team'],'away':r['away_team'],'location':r.get('location'),'stadium':r.get('stadium'),'roof':r.get('roof'),'played':bool(r.get('home_score') not in ('',None,'NA') and r.get('away_score') not in ('',None,'NA'))})
              teams = {g[k] for g in records for k in ('home','away')}
              if len(teams)!=32 or len(records)<250: raise ValueError('Cobertura de calendario insuficiente')
              result.update(ok=True,records=records)
              print(f'Calendario: {len(records)} partidos REG, {len(teams)} equipos, temporada {season}')
          except Exception as exc:
              print(f'::warning::Calendario no disponible: {type(exc).__name__}: {exc}')
          pathlib.Path('data').mkdir(exist_ok=True)
          pathlib.Path('data/schedule.json').write_text(json.dumps(result,ensure_ascii=False),encoding='utf-8')
          PY
      - name: Descargar clima historico NFL (nflverse)
        run: |
          python3 - <<'PY'
          import csv, datetime, io, json, math, pathlib, urllib.request
          now = datetime.datetime.now(datetime.timezone.utc)
          latest = now.year if now.month >= 8 else now.year-1
          result = {'source':'nflverse - games.csv','fetched_at':now.isoformat(),'ok':False,'records':[]}
          def number(x, low, high):
              try:
                  v=float(x)
                  return v if math.isfinite(v) and low<=v<=high else None
              except (ValueError,TypeError): return None
          try:
              req=urllib.request.Request('https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv',headers={'User-Agent':'BORU-NFL/1.0'})
              with urllib.request.urlopen(req,timeout=60) as response:
                  rows=csv.DictReader(io.StringIO(response.read().decode('utf-8-sig')))
                  required={'game_id','season','week','game_type','home_team','away_team','home_score','away_score','roof','temp','wind'}
                  if not required.issubset(rows.fieldnames or []): raise ValueError('Columnas de clima ausentes')
                  records=[]
                  for r in rows:
                      if r['game_type']!='REG' or r['season'] not in [str(y) for y in range(latest-4,latest+1)]: continue
                      if number(r['home_score'],0,100) is None or number(r['away_score'],0,100) is None: continue
                      if not all(r[k] for k in ['game_id','home_team','away_team','week']): continue
                      records.append({'id':r['game_id'],'season':int(r['season']),'week':int(r['week']),'home':r['home_team'],'away':r['away_team'],'roof':r['roof'].strip().lower(),'temp_f':number(r['temp'],-60,140),'wind_mph':number(r['wind'],0,150)})
              if len({g['id'] for g in records})!=len(records): raise ValueError('Partidos duplicados')
              if len(records)<250: raise ValueError('Cobertura insuficiente')
              result.update(ok=True,records=records)
              for year in sorted({g['season'] for g in records}):
                  a=[g for g in records if g['season']==year]
                  print(f"Clima {year}: {len(a)} partidos REG finalizados; viento {sum(g['wind_mph'] is not None for g in a)}; temperatura {sum(g['temp_f'] is not None for g in a)}")
              print(f'Weather Impact: {len(records)} partidos historicos')
          except Exception as exc:
              print(f'::warning::Clima historico no disponible: {type(exc).__name__}: {exc}')
          pathlib.Path('data').mkdir(exist_ok=True)
          pathlib.Path('data/weather_history.json').write_text(json.dumps(result,ensure_ascii=False),encoding='utf-8')
          PY
      - name: Descargar titulares NFL (News Radar)
        run: |
          python3 - <<'PY'
          import datetime, email.utils, json, pathlib, urllib.request, urllib.parse, xml.etree.ElementTree as ET
          now = datetime.datetime.now(datetime.timezone.utc)
          result = {'fetched_at':now.isoformat(),'ok':False,'sources':[],'records':[]}
          sources = [('ESPN','https://site.api.espn.com/apis/site/v2/sports/football/nfl/news','json'),('NFL.com','https://www.nfl.com/sitemap-fast-changing.xml','sitemap'),('CBS Sports','https://www.cbssports.com/rss/headlines/nfl/','rss')]
          seen = set()
          def add(title, link, date, source):
              title = ' '.join((title or '').split())[:350]
              try:
                  u = urllib.parse.urlsplit(link or '')
                  allowed = {'ESPN':('espn.com',),'NFL.com':('nfl.com',),'CBS Sports':('cbssports.com',)}[source]
                  if u.scheme not in ('http','https') or not any(u.hostname == d or (u.hostname or '').endswith('.'+d) for d in allowed): return
                  if not title or not date: return
                  try: dt = datetime.datetime.fromisoformat(date.replace('Z','+00:00'))
                  except ValueError: dt = email.utils.parsedate_to_datetime(date)
                  if dt.tzinfo is None: return
                  age = (now-dt).total_seconds()/86400
                  if age < -0.1 or age > 21: return
                  canonical = urllib.parse.urlunsplit(('https',u.netloc,u.path,'',''))
                  if canonical in seen: return
                  seen.add(canonical)
                  result['records'].append({'title':title,'url':canonical,'published_at':dt.isoformat(),'source':source})
              except (ValueError,TypeError,OverflowError): return
          for source,url,kind in sources:
              before = len(result['records'])
              try:
                  req = urllib.request.Request(url,headers={'User-Agent':'BORU-NFL/1.0','Accept':'application/json' if kind == 'json' else 'application/xml,text/xml,*/*'})
                  with urllib.request.urlopen(req,timeout=20) as response:
                      raw = response.read(12_000_001)
                  if len(raw)>12_000_000: raise ValueError('feed demasiado grande')
                  root = ET.fromstring(raw) if kind != 'json' else None
                  if kind == 'json':
                      payload = json.loads(raw)
                      items = payload.get('articles') if isinstance(payload,dict) else None
                      if not isinstance(items,list) or not items: raise ValueError('JSON sin articulos')
                      for i in items:
                          if not isinstance(i,dict): continue
                          links = i.get('links') or {}
                          web = links.get('web') or {} if isinstance(links,dict) else {}
                          if not isinstance(web,dict): continue
                          title, link, date = i.get('headline'), web.get('href'), i.get('published')
                          if not all(isinstance(v,str) and v for v in (title,link,date)): continue
                          add(title,link,date,source)
                  elif kind == 'rss':
                      items = root.findall('./channel/item')
                      if not items: raise ValueError('RSS sin items')
                      for i in items: add(i.findtext('title'),i.findtext('link'),i.findtext('pubDate'),source)
                  else:
                      ns = {'s':'http://www.sitemaps.org/schemas/sitemap/0.9','n':'http://www.google.com/schemas/sitemap-news/0.9'}
                      items = root.findall('s:url',ns)
                      if not items: raise ValueError('Indice sin URLs')
                      for i in items: add(i.findtext('n:news/n:title',namespaces=ns),i.findtext('s:loc',namespaces=ns),i.findtext('n:news/n:publication_date',namespaces=ns),source)
                  count = len(result['records'])-before
                  result['sources'].append({'name':source,'ok':bool(count),'count':count})
                  print(f'Noticias {source}: {count} titulares recientes')
              except Exception as exc:
                  result['sources'].append({'name':source,'ok':False,'count':0})
                  print(f'::warning::Noticias {source}: {type(exc).__name__}')
          result['ok'] = any(s['ok'] for s in result['sources'])
          result['records'].sort(key=lambda r:r['published_at'],reverse=True)
          pathlib.Path('data').mkdir(exist_ok=True)
          pathlib.Path('data/news.json').write_text(json.dumps(result,ensure_ascii=False),encoding='utf-8')
          print(f'News Radar: {len(result["records"])} titulares; {sum(s["ok"] for s in result["sources"])} fuentes con datos')
          PY
      - name: Descargar participacion ofensiva NFL (Player Usage)
        run: |
          python3 - <<'PY'
          """Optional nflverse/PFR snap data for BÖRU NFL. Run before Pages artifact upload."""
          import csv, datetime as dt, io, json, math, pathlib, urllib.request
          from collections import defaultdict
          BASE = 'https://github.com/nflverse/nflverse-data/releases/download/'

          def rows(path, required):
              req = urllib.request.Request(BASE + path, headers={'User-Agent':'BORU-NFL/1.0'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  raw = r.read(50_000_001)
                  if len(raw)>50_000_000: raise ValueError('Source too large: '+path)
                  raw = raw.decode('utf-8-sig')
              data = csv.DictReader(io.StringIO(raw))
              if not set(required).issubset(data.fieldnames or []):
                  raise ValueError('Missing fields: ' + path)
              return list(data)

          def number(s, lo, hi):
              try:
                  n = float(s)
                  return n if math.isfinite(n) and lo <= n <= hi else None
              except (TypeError, ValueError):
                  return None

          def identity_map(players):
              pfr, gsis = defaultdict(set), defaultdict(set)
              for p in players:
                  a, b = ((p.get(k) or '').strip() for k in ('pfr_id','gsis_id'))
                  if a and b and a.lower() not in ('na','null','nan','none') and b.lower() not in ('na','null','nan','none'):
                      pfr[a].add(b); gsis[b].add(a)
              return {a:next(iter(bs)) for a,bs in pfr.items() if len(bs)==1 and len(gsis[next(iter(bs))])==1}

          def convert(source, mapping, year):
              source = [r for r in source if r['game_type']=='REG' and str(r['season'])==str(year)]
              # nflverse uses fractions in some releases; detect a dataset-wide scale from the maximum.
              vals = [v for r in source if (v:=number(r['offense_pct'],0,100)) is not None]
              top=max(vals,default=0)
              if not (0.9<=top<=1 or 90<=top<=100):
                  raise ValueError('Unrecognized percentage scale')
              scale=100 if top<=1 else 1
              records, bad = {}, set()
              for r in source:
                  pid=mapping.get(r['pfr_player_id']); week=number(r['week'],1,18)
                  if not pid or week is None or int(week)!=week or not r['team'] or not r['opponent']: continue
                  count=number(r['offense_snaps'],0,200); pct=number(r['offense_pct'],0,100/scale)
                  if count is not None and not count.is_integer(): count=None
                  if pct is not None: pct=round(pct*scale,4)
                  if count is None and pct is None: continue
                  if count==0 and pct not in (None,0) or count and pct==0: pct=None
                  key=(pid,int(week),r['team'],r['opponent'])
                  item={'player_id':pid,'season':year,'week':int(week),'team':r['team'],'opponent':r['opponent'],'snaps':count,'share_pct':pct}
                  if key in records and records[key]!=item: bad.add(key)
                  else: records[key]=item
              return [r for k,r in records.items() if k not in bad]

          def main():
              now=dt.datetime.now(dt.timezone.utc); latest=now.year if now.month>=8 else now.year-1
              result={'source':'nflverse / Pro Football Reference','fetched_at':now.isoformat(),'ok':False,'seasons':{},'records':[]}
              try:
                  mapping=identity_map(rows('players/players.csv',['gsis_id','pfr_id']))
                  if len(mapping)<1000: raise ValueError('Insufficient identity coverage')
                  stats = json.loads(pathlib.Path('data/player_stats.json').read_text(encoding='utf-8'))
                  ids_by_year = defaultdict(set)
                  for r in stats['records']:
                      if r.get('player_id'): ids_by_year[int(r['season'])].add(str(r['player_id']).strip())
                  for year in range(latest-4,latest+1):
                      try:
                          data=convert(rows(f'snap_counts/snap_counts_{year}.csv',['season','game_type','week','pfr_player_id','team','opponent','offense_snaps','offense_pct']),mapping,year)
                          data = [r for r in data if r['player_id'] in ids_by_year[year]]
                          if not data: raise ValueError('No matched rows')
                          result['records'].extend(data); result['seasons'][str(year)]={'ok':True,'count':len(data)}
                          print(f'Player Usage {year}: {len(data)} records matched by ID')
                      except Exception as exc:
                          result['seasons'][str(year)]={'ok':False,'count':0}; print(f'::warning::Player Usage {year}: {type(exc).__name__}: {exc}')
              except Exception as exc:
                  print(f'::warning::Player Usage identity source: {type(exc).__name__}: {exc}')
              result['ok']=bool(result['records'])
              path=pathlib.Path('data/snap_counts.json'); path.parent.mkdir(exist_ok=True)
              path.write_text(json.dumps(result,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
              print(f'Player Usage: {len(result["records"])} records; ok={result["ok"]}')
          if __name__=='__main__': main()
          PY
      - name: Descargar contexto de partido NFL (Game Context)
        timeout-minutes: 15
        run: |
          python3 - <<'PY'
          import csv, datetime, gzip, io, json, math, pathlib, urllib.request
          from collections import defaultdict
          
          def number(v):
              try:
                  x=float(v)
                  return x if math.isfinite(x) else None
              except (ValueError,TypeError): return None
          
          def team(v):
              v=str(v or '').strip().upper()
              return {'LAR':'LA','JAC':'JAX','WSH':'WAS','OAK':'LV','SD':'LAC','STL':'LA'}.get(v,v)
          
          def aggregate(rows, year, games):
              required={'game_id','play_id','season_type','season','week','posteam','defteam','play_type','score_differential','yardline_100','epa','success','two_point_attempt','qb_dropback','pass_attempt','rush_attempt','sack','passer_player_id','receiver_player_id','rusher_player_id','passing_yards','receiving_yards','rushing_yards','complete_pass'}
              if not required.issubset(rows.fieldnames or []): raise ValueError('Columnas PBP ausentes: '+str(sorted(required-set(rows.fieldnames or []))))
              # Team vector: plays, dropbacks, designed/non-dropback runs, EPA sum/count, success sum/count, red-zone plays/count known.
              # Player vector: attempts, completions, pass yards, carries, rush yards, targets, receptions, rec yards, red-zone attempts/carries/targets, known zone counts by role, valid yards counts by role.
              ts=defaultdict(lambda: [0]*9); ps=defaultdict(lambda: [0]*17); dx=defaultdict(lambda: [0]*12); seen=set()
              for r in rows:
                  g=games.get(r['game_id']); t=team(r['posteam']); opp=team(r['defteam'])
                  if not g or r['season_type']!='REG' or number(r['season'])!=year or number(r['week'])!=g['week'] or not t or not opp or t==opp or {t,opp}!={g['home'],g['away']}: continue
                  if r['play_type'] not in ('pass','run') or number(r['two_point_attempt'])!=0: continue
                  d=number(r['qb_dropback']);
                  if d not in (0,1) or (d==0 and r['play_type']!='run'): continue
                  key=(r['game_id'],r['play_id']);
                  if not r['play_id'] or key in seen: continue
                  seen.add(key)
                  score=number(r['score_differential']); state='unknown' if score is None else 'lead' if score>0 else 'trail' if score<0 else 'tie'
                  zone=number(r['yardline_100']); known=zone is not None and 0<=zone<=100; rz=known and zone<=20
                  a=ts[(r['game_id'],t,state)]; a[0]+=1; a[1]+=int(d); a[2]+=int(1-d)
                  e=number(r['epa']); s=number(r['success']);
                  if e is not None: a[3]+=e; a[4]+=1
                  if s in (0,1): a[5]+=int(s); a[6]+=1
                  a[7]+=int(rz); a[8]+=int(known)
                  # Additional defensive metrics, stored under the attacking team.
                  b=dx[(r['game_id'],t,state)]
                  if d==1:
                      sack=number(r.get('sack')); hit=number(r.get('qb_hit'))
                      if sack in (0,1): b[0]+=int(sack); b[1]+=1
                      if hit in (0,1): b[2]+=int(hit); b[3]+=1
                  yd=number(r.get('yards_gained'))
                  if yd is not None:
                      if r['play_type']=='pass' and number(r.get('pass_attempt'))==1 and number(r.get('sack'))==0:
                          b[4]+=int(yd>=20); b[5]+=1
                      if r['play_type']=='run' and number(r.get('rush_attempt'))==1:
                          b[6]+=int(yd>=10); b[7]+=1
                  if rz:
                      if e is not None: b[8]+=e; b[9]+=1
                      if s in (0,1): b[10]+=int(s); b[11]+=1
                  comp=number(r['complete_pass'])
                  def event(pid,role,yd):
                      pid=str(pid or '').strip()
                      if not pid or pid.upper() in ('NA','NAN','NULL'): return
                      p=ps[(r['game_id'],t,pid,state)]
                      idx,yidx,zidx,kidx,vix={'pass':(0,2,8,11,14),'rush':(3,4,9,12,15),'target':(5,7,10,13,16)}[role]
                      p[idx]+=1; p[zidx]+=int(rz); p[kidx]+=int(known)
                      if role=='pass' and comp==1: p[1]+=1
                      if role=='target' and comp==1: p[6]+=1
                      if yd is not None: p[yidx]+=yd; p[vix]+=1
                  if r['play_type']=='pass' and number(r['pass_attempt'])==1 and number(r['sack'])==0:
                      event(r['passer_player_id'],'pass',number(r['passing_yards']) if comp!=0 else 0)
                      event(r['receiver_player_id'],'target',number(r['receiving_yards']) if comp!=0 else 0)
                  if r['play_type']=='run' and number(r['rush_attempt'])==1:
                      event(r['rusher_player_id'],'rush',number(r['rushing_yards']))
              teams=defaultdict(dict); players=defaultdict(dict)
              for (gid,t,state),a in ts.items():
                  a[3]=round(a[3],5); teams[(gid,t)][state]=a
              complete={gid for gid,g in games.items() if all(sum(a[0] for a in teams.get((gid,t),{}).values())>=20 for t in (g['home'],g['away']))}
              for (gid,t,pid,state),a in ps.items():
                  if gid in complete: players[(gid,t,pid)][state]=a
              records=[]; previous={}
              for gid,g in sorted(games.items(),key=lambda x:(x[1]['date'],x[0])):
                  for t,o in ((g['home'],g['away']),(g['away'],g['home'])):
                      last=previous.get(t); rest=(g['date']-last).days if last else None; previous[t]=g['date']
                      if gid in complete: records.append({'id':gid,'week':g['week'],'team':t,'opponent':o,'date':g['date'].isoformat(),'rest':rest,'states':teams[(gid,t)],'defense_ext':{state:[round(v,5) for v in dx[(gid,t,state)]] for state in teams[(gid,t)]}})
              pr=[{'id':gid,'team':t,'player_id':pid,'states':states} for (gid,t,pid),states in players.items()]
              return records,pr,len(complete)
          
          def main():
              now=datetime.datetime.now(datetime.timezone.utc); latest=now.year if now.month>=8 else now.year-1
              root=pathlib.Path('data'); root.mkdir(exist_ok=True)
              games_by_year=defaultdict(dict)
              try:
                  req=urllib.request.Request('https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv',headers={'User-Agent':'BORU-NFL/1.0'})
                  with urllib.request.urlopen(req,timeout=60) as response:
                      for r in csv.DictReader(io.TextIOWrapper(response,encoding='utf-8-sig')):
                          y=number(r.get('season')); w=number(r.get('week'))
                          if y is None or y not in range(latest-4,latest+1) or w is None or r.get('game_type')!='REG' or number(r.get('home_score')) is None or number(r.get('away_score')) is None: continue
                          try: date=datetime.date.fromisoformat(r['gameday'])
                          except (ValueError,KeyError): continue
                          h,a=team(r.get('home_team')),team(r.get('away_team')); gid=r.get('game_id')
                          if gid and h and a and h!=a and date<=now.date(): games_by_year[int(y)][gid]={'home':h,'away':a,'week':int(w),'date':date}
              except Exception as exc: print(f'::warning::Game Context calendario no disponible: {type(exc).__name__}')
              for year in range(latest-4,latest+1):
                  result={'source':'nflverse PBP / nflfastR','fetched_at':now.isoformat(),'season':year,'ok':False,'teams':[],'players':[],'games_expected':len(games_by_year[year]),'games_covered':0}
                  try:
                      if not games_by_year[year]: raise ValueError('Sin calendario finalizado')
                      url=f'https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_{year}.csv.gz'
                      req=urllib.request.Request(url,headers={'User-Agent':'BORU-NFL/1.0'})
                      with urllib.request.urlopen(req,timeout=120) as response, gzip.GzipFile(fileobj=response) as gz, io.TextIOWrapper(gz,encoding='utf-8-sig') as stream:
                          teams,players,n=aggregate(csv.DictReader(stream),year,games_by_year[year])
                      if not n or not players: raise ValueError('Sin datos interpretables')
                      result.update(ok=True,teams=teams,players=players,games_covered=n)
                      print(f'Game Context {year}: {n}/{len(games_by_year[year])} games, {len(players)} player-game records')
                      if n<len(games_by_year[year]): print(f'::warning::Game Context {year}: cobertura parcial')
                  except Exception as exc: print(f'::warning::Game Context {year}: {type(exc).__name__}: {exc}')
                  (root/f'game_context_{year}.json').write_text(json.dumps(result,ensure_ascii=False,separators=(',',':'),allow_nan=False),encoding='utf-8')
          if __name__=='__main__': main()
